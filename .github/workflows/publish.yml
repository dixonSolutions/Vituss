name: Publish

# Runs on every push to main. Whether anything is actually released is decided by
# scripts/publish-workspace.sh, which asks crates.io what is already there and
# publishes only the remainder. An ordinary commit finds every crate already at
# its version and does nothing; bumping [workspace.package] version is what makes
# a release happen.
#
# The script owns that decision rather than a separate gate job, because a
# release can end up partially complete — crates.io rate limits new crate names —
# and only a per-crate check can resume one correctly.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be published, without publishing"
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  publish:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    environment: crates-io
    # Waiting out the new-crate rate limit takes about ten minutes per crate, and
    # only ever on a first release. The default 360 is enough for this workspace;
    # raise it if the workspace grows a lot.
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish whatever is not on crates.io yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: ./scripts/publish-workspace.sh

      - name: Read the released version
        id: v
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Only meaningful once the release actually completed, and only the first
      # time for any given version.
      - name: Tag the release
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "v$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already tagged; nothing to do."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "Vituss v$VERSION"
          git push origin "v$VERSION"
